<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Abas</title>
<style>
    :root
    {
        --bar: #0f0f0f;
        --tab: #1f1f1f;
        --tab-hover: #2a2a2a;
        --tab-active: #303030;
        --text: #f1f1f1;
        --muted: #aaaaaa;
        --accent: #7c3aed;
    }

    html, body
    {
        margin: 0;
        height: 100%;
        background: var(--bar);
        color: var(--text);
        font: 12px/1 Roboto, "Segoe UI", Arial, sans-serif;
        overflow: hidden;
        user-select: none;
    }

    #bar
    {
        display: flex;
        align-items: flex-end;
        gap: 4px;
        height: 100%;
        padding: 0 6px;
        box-sizing: border-box;
    }

    #tabs
    {
        display: flex;
        gap: 4px;
        min-width: 0;
        height: 32px;
        overflow: hidden;
    }

    .tab
    {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 0 1 220px;
        min-width: 60px;
        padding: 0 6px 0 12px;
        border-radius: 8px 8px 0 0;
        background: var(--tab);
        color: var(--muted);
        cursor: default;
    }

    .tab:hover
    {
        background: var(--tab-hover);
    }

    .tab.active
    {
        background: var(--tab-active);
        color: var(--text);
        box-shadow: inset 0 2px 0 var(--accent);
    }

    .title
    {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        line-height: 32px;
    }

    .close, #new
    {
        display: grid;
        place-items: center;
        flex: none;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font: inherit;
    }

    .close
    {
        width: 20px;
        height: 20px;
        font-size: 14px;
    }

    .close:hover, #new:hover
    {
        background: rgba(255, 255, 255, 0.12);
    }

    #new
    {
        width: 28px;
        height: 28px;
        margin-bottom: 2px;
        color: var(--text);
        font-size: 20px;
    }
</style>
</head>
<body>
<div id="bar">
    <div id="tabs"></div>
    <button id="new" title="Nova aba (Ctrl+N)">+</button>
</div>
<script>
    function invoke(cmd, args)
    {
        return window.__TAURI_INTERNALS__.invoke(cmd, args || {});
    }

    var activeId = null;

    // Called from Rust with [{ id, title, active }]
    window.renderTabs = function (tabs)
    {
        var active = tabs.find(function (tab) { return tab.active; });
        activeId = active ? active.id : null;
        var container = document.getElementById('tabs');
        container.replaceChildren();
        tabs.forEach(function (tab)
        {
            var element = document.createElement('div');
            element.className = 'tab' + (tab.active ? ' active' : '');
            element.title = tab.title;

            var title = document.createElement('span');
            title.className = 'title';
            title.textContent = tab.title;

            var close = document.createElement('button');
            close.className = 'close';
            close.title = 'Fechar aba (Ctrl+W)';
            close.textContent = '×';
            close.addEventListener('click', function (event)
            {
                event.stopPropagation();
                invoke('close_tab', { id: tab.id });
            });

            element.addEventListener('mousedown', function (event)
            {
                // Activating re-renders the bar, which would swallow the click on the close button
                if (event.button === 0 && !event.target.closest('.close'))
                {
                    invoke('activate_tab', { id: tab.id });
                }
            });
            element.addEventListener('auxclick', function (event)
            {
                if (event.button === 1)
                {
                    event.preventDefault();
                    invoke('close_tab', { id: tab.id });
                }
            });

            element.append(title, close);
            container.appendChild(element);
        });
    };

    document.getElementById('new').addEventListener('click', function ()
    {
        invoke('new_tab', { url: null, background: false });
    });

    document.addEventListener('keydown', function (event)
    {
        if (!event.ctrlKey)
        {
            return;
        }
        var key = event.key.toLowerCase();
        if (key === 'n')
        {
            invoke('new_tab', { url: null, background: false });
        }
        else if (key === 'w')
        {
            if (activeId !== null)
            {
                invoke('close_tab', { id: activeId });
            }
        }
        else if (key === 'tab' || key === 'pagedown' || key === 'pageup')
        {
            invoke('cycle_tab', { offset: (event.shiftKey || key === 'pageup') ? -1 : 1 });
        }
        else
        {
            return;
        }
        event.preventDefault();
    });
</script>
</body>
</html>
